name: Upstream Sync Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Detect current and latest upstream version
        id: detect
        run: |
          # Find our current stitchlabos branch (most recent)
          CURRENT_BRANCH=$(git branch -r --list 'origin/stitchlabos/*' --sort=-committerdate | head -1 | xargs)
          CURRENT_BRANCH="${CURRENT_BRANCH#origin/}"
          CURRENT_VERSION="${CURRENT_BRANCH#stitchlabos/v}"
          echo "current_branch=$CURRENT_BRANCH" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT_BRANCH (v$CURRENT_VERSION)"

          # Fetch upstream tags
          git remote add upstream https://github.com/mainsail-crew/mainsail.git 2>/dev/null || true
          git fetch upstream --tags

          # Find latest upstream release tag (vX.Y.Z, no pre-releases)
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -v '-' | head -1)
          LATEST_VERSION="${LATEST_TAG#v}"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "Latest upstream: $LATEST_TAG"

          # Compare versions
          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "up_to_date=true" >> $GITHUB_OUTPUT
            echo "Already up to date."
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
            echo "New upstream version available: $LATEST_TAG"
          fi

      - name: Attempt rebase onto new upstream version
        if: steps.detect.outputs.up_to_date == 'false'
        id: rebase
        run: |
          CURRENT="${{ steps.detect.outputs.current_branch }}"
          CURRENT_VERSION="${{ steps.detect.outputs.current_version }}"
          LATEST_TAG="${{ steps.detect.outputs.latest_tag }}"
          LATEST_VERSION="${{ steps.detect.outputs.latest_version }}"
          NEW_BRANCH="stitchlabos/v${LATEST_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create new branch from upstream tag
          git checkout -b "$NEW_BRANCH" "$LATEST_TAG"

          # Attempt rebase of our commits onto the new base
          if git rebase --onto "$LATEST_TAG" "v${CURRENT_VERSION}" "origin/${CURRENT}"; then
            echo "rebase_clean=true" >> $GITHUB_OUTPUT
            git push origin "$NEW_BRANCH"
            echo "Clean rebase — pushed $NEW_BRANCH"
          else
            echo "rebase_clean=false" >> $GITHUB_OUTPUT
            # Collect conflict info for the PR body
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "unknown")
            echo "conflicts<<EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            git rebase --abort
            # Push the branch at the upstream tag point so the PR can be created
            git checkout -b "$NEW_BRANCH" "$LATEST_TAG" 2>/dev/null || git checkout "$NEW_BRANCH"
            git push origin "$NEW_BRANCH"
          fi

          echo "new_branch=$NEW_BRANCH" >> $GITHUB_OUTPUT

      - name: Create PR (clean rebase)
        if: steps.detect.outputs.up_to_date == 'false' && steps.rebase.outputs.rebase_clean == 'true'
        run: |
          gh pr create \
            --title "chore: rebase onto upstream ${{ steps.detect.outputs.latest_tag }}" \
            --base "${{ steps.detect.outputs.current_branch }}" \
            --head "${{ steps.rebase.outputs.new_branch }}" \
            --body "$(cat <<'EOF'
          ## Upstream sync

          Upstream released **${{ steps.detect.outputs.latest_tag }}**. Our StitchLAB commits have been cleanly rebased onto the new base.

          ### What to do
          1. Review the changes
          2. Merge this PR
          3. CI will automatically build and publish a new StitchLAB release

          > Auto-generated by upstream-sync workflow
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR (conflicts)
        if: steps.detect.outputs.up_to_date == 'false' && steps.rebase.outputs.rebase_clean == 'false'
        run: |
          gh pr create \
            --title "chore: rebase onto upstream ${{ steps.detect.outputs.latest_tag }} (conflicts)" \
            --base "${{ steps.detect.outputs.current_branch }}" \
            --head "${{ steps.rebase.outputs.new_branch }}" \
            --body "$(cat <<'EOF'
          ## Upstream sync — manual resolution needed

          Upstream released **${{ steps.detect.outputs.latest_tag }}**. The automatic rebase had conflicts.

          ### Conflicting files
          ```
          ${{ steps.rebase.outputs.conflicts }}
          ```

          ### How to resolve
          ```bash
          git fetch origin
          git checkout ${{ steps.rebase.outputs.new_branch }}
          git rebase --onto ${{ steps.detect.outputs.latest_tag }} v${{ steps.detect.outputs.current_version }} origin/${{ steps.detect.outputs.current_branch }}
          # Fix conflicts, then:
          git add <resolved files>
          git rebase --continue
          git push origin ${{ steps.rebase.outputs.new_branch }} --force-with-lease
          ```

          > Auto-generated by upstream-sync workflow
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
